<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All in One Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0A0E16;
  --panel:#121826cc;
  --panel-solid:#121826;
  --border:#26304510;
  --border-soft:#ffffff14;
  --ink:#EAF0FA;
  --ink-dim:#8B96AC;
  --ink-faint:#5A6478;
  --mint:#3ED9A0;
  --blue:#4C8DFF;
  --gold:#D6A93C;
  --amber:#E0A83E;
  --brick:#C24B4B;
  --green:#34D399;
  --red:#F87171;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
.num,.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:var(--mint);color:#0A0E16;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ---------- layout shell ---------- */
.shell{display:flex;min-height:100vh;}

/* ---------- sidebar ---------- */
.sidebar{
  width:250px;
  flex-shrink:0;
  background:#0D1220;
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  transition:width .25s cubic-bezier(.4,0,.2,1);
  position:sticky;
  top:0;
  height:100vh;
  z-index:20;
}
.sidebar.collapsed{width:72px;}
.sb-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 18px;border-bottom:1px solid var(--border-soft);
}
.sb-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13.5px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;}
.sb-logo .mark{width:22px;height:22px;flex-shrink:0;border-radius:6px;background:linear-gradient(135deg,var(--mint),var(--blue));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#061018;}
.sidebar.collapsed .sb-logo span:not(.mark){display:none;}
.sb-toggle{
  background:none;border:none;color:var(--ink-dim);width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sb-toggle:hover{background:#ffffff10;color:var(--ink);}
.sb-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sb-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:var(--ink-dim);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  border:1px solid transparent;
}
.sb-item .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.sb-item:hover{background:#ffffff08;color:var(--ink);}
.sb-item.active{background:#ffffff0f;color:var(--ink);border-color:var(--border-soft);}
.sb-item.active .dot{width:6px;height:6px;border-radius:50%;background:var(--accent,var(--mint));margin-left:auto;flex-shrink:0;}
.sidebar.collapsed .sb-item span:not(.ic){display:none;}
.sidebar.collapsed .sb-item{justify-content:center;}
/* expandable "Investment Dashboard" nav group */
.sb-group-head{display:flex;align-items:center;gap:2px;}
.sb-group-head .sb-item{flex:1;min-width:0;}
.sb-chev{background:none;border:none;color:var(--ink-dim);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-chev:hover{background:#ffffff10;color:var(--ink);}
.sb-chev svg{transition:transform .15s;}
.sb-chev.open svg{transform:rotate(90deg);}
.sb-sub{margin:2px 0 4px 18px;padding-left:8px;border-left:1px solid var(--border-soft);display:flex;flex-direction:column;gap:2px;}
.sb-sub.closed{display:none;}
.sidebar.collapsed .sb-chev{display:none;}
.sidebar.collapsed .sb-sub{margin-left:0;padding-left:0;border-left:none;}
.sidebar.collapsed .sb-sub.closed{display:flex;} /* icon-only rail always shows every icon */
.sb-group{margin-bottom:6px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.pbar{height:8px;border-radius:999px;background:#ffffff14;overflow:hidden;margin:6px 0 4px;}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--accent,var(--mint));}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff0a;font-size:12.5px;}
.kv b{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.dot-c{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;}
tr.total-row td{border-top:1px solid var(--border-soft);font-weight:600;}
.badge.ok{background:#34D39922;color:var(--green);}
.badge.warn{background:#E0A83E22;color:var(--amber);}
.badge.bad{background:#F8717122;color:var(--red);}
.badge.dim{background:#ffffff10;color:var(--ink-faint);}
.view[data-theme="debtdash"],.view[data-theme="mydebts"],.view[data-theme="debtentry"]{--accent:var(--red);}
.sb-foot{padding:14px 18px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .sb-foot{opacity:0;}

/* ---------- main ---------- */
.main{flex:1;min-width:0;position:relative;}
.view{display:none;min-height:100vh;position:relative;}
.view.active{display:block;}
.bg-photo{
  position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:.16;filter:saturate(1.1);
}
.bg-fade{position:absolute;inset:0;background:linear-gradient(180deg,#0A0E16 0%,#0A0E16cc 12%,#0A0E16 55%);}
.content{position:relative;z-index:2;padding:28px 34px 60px;max-width:1400px;}

/* ---------- ticker (signature element) ---------- */
.ticker-rail{
  position:relative;z-index:2;
  border-bottom:1px solid var(--border-soft);
  background:#0000002a;
  overflow:hidden;white-space:nowrap;padding:9px 0;
}
.ticker-track{display:inline-flex;gap:34px;animation:scrollTicker 38s linear infinite;padding-left:100%;}
@keyframes scrollTicker{from{transform:translateX(0);}to{transform:translateX(-100%);}}
.tick-item{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);display:inline-flex;gap:7px;align-items:center;}
.tick-item b{color:var(--ink);font-weight:600;}
.tick-up{color:var(--green);}
.tick-down{color:var(--red);}

/* ---------- page header ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent,var(--mint));font-weight:600;margin-bottom:6px;}
.page-title{font-size:26px;font-weight:800;}
.page-sub{color:var(--ink-dim);font-size:13px;margin-top:4px;}

/* ---------- stat cards ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.card{
  background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;
}
.stat-label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.stat-value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
.stat-delta{font-size:12px;margin-top:6px;font-family:'IBM Plex Mono',monospace;}
.up{color:var(--green);}.down{color:var(--red);}

/* ---------- chart cards ---------- */
.chart-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px;}
.chart-grid.full{grid-template-columns:1fr;}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;}
.chart-card h3{font-size:14px;font-weight:700;margin-bottom:2px;}
.chart-card .sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:14px;}
.chart-wrap{position:relative;height:260px;}
.chart-wrap.tall{height:300px;}

/* ---------- tables / forms ---------- */
.panel{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.panel-head h3{font-size:15px;font-weight:700;}
.btn{
  background:var(--accent,var(--mint));color:#08110D;border:none;padding:9px 15px;border-radius:9px;
  font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;border:1px solid var(--border-soft);color:var(--ink);}
.btn.tiny{padding:5px 10px;font-size:11px;border-radius:7px;}
.btn.danger{background:#3a1418;color:var(--red);border:1px solid #F8717133;}

.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--ink-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select{
  width:100%;background:#ffffff08;border:1px solid var(--border-soft);color:var(--ink);
  padding:9px 10px;border-radius:8px;font-size:13px;
}
.field select{color-scheme:dark;}
.field select option{background:#121826;color:#EAF0FA;}
.field input:focus,.field select:focus{outline:2px solid var(--accent,var(--mint));outline-offset:0;border-color:transparent;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
  padding:8px 10px;border-bottom:1px solid var(--border-soft);font-weight:600;
}
tbody td{padding:11px 10px;border-bottom:1px solid #ffffff0a;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
tbody tr:hover{background:#ffffff05;}
tbody td.name{font-family:'Inter',sans-serif;font-weight:500;}
.table-scroll{overflow-x:auto;}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}
.empty-state b{color:var(--ink-dim);display:block;margin-bottom:4px;font-size:14px;}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.02em;}
.badge.live{background:#34D39922;color:var(--green);}
.badge.cached{background:#E0A83E22;color:var(--amber);}
.tag{font-size:10px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}
.rate-note{font-size:11.5px;color:var(--ink-faint);margin-top:10px;font-family:'IBM Plex Mono',monospace;}

/* per-page accents */
.view[data-theme="dashboard"]{--accent:var(--mint);}
.view[data-theme="instocks"]{--accent:var(--mint);}
.view[data-theme="usstocks"]{--accent:var(--blue);}
.view[data-theme="mf"]{--accent:var(--gold);}
.view[data-theme="ppf"]{--accent:var(--amber);}
.view[data-theme="epf"]{--accent:var(--amber);}
.view[data-theme="post"]{--accent:var(--brick);}
.view[data-theme="entry"]{--accent:var(--blue);}

@media(max-width:640px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;}
  .content{padding:20px 16px 50px;}
}
</style>
</head>
<body>

<!-- SYNC LOGIN GATE -->
<div id="authGate" style="display:none;position:fixed;inset:0;z-index:100;background:#0A0E16;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:360px;background:#121826;border:1px solid #ffffff14;border-radius:16px;padding:28px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <span style="width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#3ED9A0,#4C8DFF);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#061018;font-family:Manrope,sans-serif;">A</span>
      <b style="font-family:Manrope,sans-serif;font-size:16px;">All in One Portfolio</b>
    </div>
    <p style="color:#8B96AC;font-size:12.5px;margin-bottom:20px;">Sign in to sync your portfolio across every device.</p>
    <form id="authForm">
      <div class="field" style="margin-bottom:10px;"><label>Email</label><input required type="email" id="authEmail" placeholder="you@example.com"></div>
      <div class="field" style="margin-bottom:14px;"><label>Password</label><input required type="password" id="authPassword" placeholder="At least 6 characters" minlength="6"></div>
      <div id="authError" style="display:none;color:#F87171;font-size:12px;margin-bottom:12px;"></div>
      <button class="btn" type="submit" id="authSignIn" style="width:100%;justify-content:center;margin-bottom:8px;">Sign In</button>
      <button class="btn ghost" type="button" id="authSignUp" style="width:100%;justify-content:center;">Create Account</button>
    </form>
    <p style="color:#5A6478;font-size:11px;margin-top:16px;">First time on any device? Use "Create Account" once — then "Sign In" with the same email/password everywhere else.</p>
  </div>
</div>

<div class="shell" id="shell" style="display:none;">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-logo"><span class="mark">A</span><span>All in One Portfolio</span></div>
      <button class="sb-toggle" id="sbToggle" title="Collapse/expand">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="sbArrow"/></svg>
      </button>
    </div>
    <nav class="sb-nav" id="sbNav">
      <!-- injected -->
    </nav>
    <div class="sb-foot" id="sbFoot">Local · private · your Chrome only</div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main"></main>
</div>

<script>
/* ============================================================
   LEDGER — personal portfolio dashboard
   Single-file build. Data lives in localStorage only.
   ============================================================ */

const PAGES = [
  {id:'dashboard', label:'Investment Dashboard', theme:'dashboard', bg:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=1600&auto=format&fit=crop', icon:'grid'},
  {id:'instocks',  label:'Indian Stocks & ETFs', theme:'instocks', bg:'https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?q=80&w=1600&auto=format&fit=crop', icon:'trend'},
  {id:'usstocks',  label:'US Stocks & ETFs', theme:'usstocks', bg:'https://images.unsplash.com/photo-1591696205602-2f950c417cb9?q=80&w=1600&auto=format&fit=crop', icon:'globe'},
  {id:'mf',        label:'Mutual Funds', theme:'mf', bg:'https://images.unsplash.com/photo-1579532537598-459ecdaf39cc?q=80&w=1600&auto=format&fit=crop', icon:'layers'},
  {id:'ppf',       label:'PPF', theme:'ppf', bg:'https://images.unsplash.com/photo-1601597111158-2fceff292cdc?q=80&w=1600&auto=format&fit=crop', icon:'shield'},
  {id:'epf',       label:'EPF', theme:'epf', bg:'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=1600&auto=format&fit=crop', icon:'briefcase'},
  {id:'post',      label:'Post Office Schemes', theme:'post', bg:'https://images.unsplash.com/photo-1579208030886-b937da0925dc?q=80&w=1600&auto=format&fit=crop', icon:'mail'},
  {id:'entry',     label:'Add Entry', theme:'entry', bg:'https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=1600&auto=format&fit=crop', icon:'plus'},
  {id:'debtdash',  group:'debt', label:'DEBT Dashboard',     theme:'debtdash',  bg:'', icon:'card'},
  {id:'mydebts',   group:'debt', label:'My Debts',           theme:'mydebts',   bg:'', icon:'list'},
  {id:'debtentry', group:'debt', label:'Debt Entry',         theme:'debtentry', bg:'', icon:'plus'},
];

const ICONS = {
  grid:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>',
  trend:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 17l6-6 4 4 8-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  globe:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.7 3.8 6 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-6-3.8-9s1.3-6.3 3.8-9z" stroke="currentColor" stroke-width="1.8"/></svg>',
  layers:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 5-9 5-9-5 9-5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  shield:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 5-3 7.5-7 9-4-1.5-7-4-7-9V6l7-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  briefcase:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2" stroke="currentColor" stroke-width="1.8"/></svg>',
  mail:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  card:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M7 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  list:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
};

/* ---------------- cloud sync (Firebase) ---------------- */
// 1. Create a free project at https://console.firebase.google.com
// 2. Add a Web App, enable "Email/Password" under Authentication, enable "Firestore Database"
// 3. Paste your config below, replacing the placeholders.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDy8oz1FF0dA6iHBJsO2rfalEBHBrrqq8s",
  authDomain: "all-in-one-portfolio.firebaseapp.com",
  projectId: "all-in-one-portfolio",
  storageBucket: "all-in-one-portfolio.firebasestorage.app",
  messagingSenderId: "548121507754",
  appId: "1:548121507754:web:0d287b8ce347db9a29ddd3"
};
const SYNC_ENABLED = FIREBASE_CONFIG.apiKey !== "PASTE_YOUR_API_KEY";
let currentUser = null, fsDoc = null, firestoreDb = null;
let cloudSyncSettled = !SYNC_ENABLED; // gate: no cloud push is allowed until we've established the authoritative starting state (prevents an early auto-save from overwriting real cloud data with a stale/incomplete local copy)
let lastKnownRemoteUpdatedAt = 0; // the newest server updatedAt we've actually confirmed — used to detect "someone/something else wrote since I last synced" before ever overwriting the cloud

if(SYNC_ENABLED){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  firestoreDb = firebase.firestore();

  document.getElementById('authForm').addEventListener('submit', e=>{
    e.preventDefault();
    doAuth(auth.signInWithEmailAndPassword.bind(auth));
  });
  document.getElementById('authSignUp').addEventListener('click', ()=>{
    doAuth(auth.createUserWithEmailAndPassword.bind(auth));
  });
  function doAuth(fn){
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.style.display='none';
    fn(email, pass).catch(err=>{ errEl.textContent = err.message; errEl.style.display='block'; });
  }

  auth.onAuthStateChanged(user=>{
    if(user){
      currentUser = user;
      document.getElementById('authGate').style.display='none';
      document.getElementById('shell').style.display='flex';
      fsDoc = firestoreDb.collection('portfolios').doc(user.uid);
      const foot = document.getElementById('sbFoot');
      if(foot) foot.innerHTML = `Checking sync…<br><a href="#" id="signOutLink" style="color:#3ED9A0;">Sign out</a>`;
      fsDoc.get().then(snap=>{
        if(snap.exists){
          const remote = snap.data();
          lastKnownRemoteUpdatedAt = remote.updatedAt||0;
          if((remote.updatedAt||0) >= (DB.updatedAt||0)){
            remote.instocks = migrateStockArray(remote.instocks);
            remote.usstocks = migrateStockArray(remote.usstocks);
            DB = remote; localStorage.setItem(DB_KEY, JSON.stringify(DB));
            lastPushedUpdatedAt = remote.updatedAt||0;
          } else {
            // local is newer than cloud — we do NOT auto-push; the indicator will show
            // "unsynced changes" so you know to press "Push to Cloud Now" yourself
            lastPushedUpdatedAt = remote.updatedAt||0;
          }
        } else {
          // brand new account, nothing in the cloud yet — nothing to pull, and we don't
          // auto-push either; the sync indicator will show you have unsynced local data
          lastPushedUpdatedAt = 0;
        }
        cloudSyncSettled = true;
        updateSyncIndicator();
        renderAll();
        setTimeout(()=>{ const link=document.getElementById('signOutLink'); if(link) link.addEventListener('click', e=>{ e.preventDefault(); auth.signOut(); location.reload(); }); }, 0);
      }).catch(()=>{
        // couldn't reach Firestore at all — do NOT flip cloudSyncSettled, so any local
        // save this session stays local-only rather than risking a push of an unmerged state
        renderAll();
      });
      fsDoc.onSnapshot(snap=>{
        if(snap.metadata.hasPendingWrites) return; // ignore echo of our own write
        const remote = snap.data();
        if(remote && remote.updatedAt){
          lastKnownRemoteUpdatedAt = remote.updatedAt;
          if(remote.updatedAt > (DB.updatedAt||0)){
            remote.instocks = migrateStockArray(remote.instocks);
            remote.usstocks = migrateStockArray(remote.usstocks);
            DB = remote; localStorage.setItem(DB_KEY, JSON.stringify(DB)); renderAll();
            lastPushedUpdatedAt = remote.updatedAt;
            updateSyncIndicator();
          }
        }
      });
    } else {
      currentUser = null;
      document.getElementById('shell').style.display='none';
      document.getElementById('authGate').style.display='flex';
    }
  });
} else {
  // sync not configured — app runs fully local, same as before
  document.getElementById('shell').style.display='flex';
}

/* Cloud pushes happen ONLY via forcePushToCloud() — triggered only by the "Push to Cloud
   Now" button. There is no automatic background push anywhere in this app anymore. This
   is deliberate: an automatic push was the root cause of repeated data loss from stale/idle
   sessions overwriting newer cloud data. Local storage on this device still saves instantly
   and safely on every change — only the cloud is now a fully manual, explicit action. */
let lastBackupDate = null;
function dailyBackupIfNeeded(){
  // maintains a rolling once-per-day snapshot in a separate Firestore subcollection,
  // so a bad overwrite of the main document still leaves a same-day-or-earlier restore point
  if(!SYNC_ENABLED || !currentUser) return;
  const today = todayStr();
  if(lastBackupDate === today) return;
  lastBackupDate = today;
  try{
    firestoreDb.collection('portfolios').doc(currentUser.uid).collection('backups').doc(today).set(DB).catch(()=>{});
  }catch(e){}
}

/* Even manual pushes never blindly overwrite: this reads the server's current copy inside a
   transaction first, and refuses to write if the server has something newer than what this
   session last confirmed (e.g. pushed from another tab or device). Pass force=true only after
   the person has been shown that conflict and explicitly chosen to overwrite anyway. */
async function safePushToCloud(force){
  if(!SYNC_ENABLED || !fsDoc) return {ok:false, reason:'Cloud sync isn\'t set up on this device.'};
  DB.updatedAt = Date.now();
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  const snapshotToPush = DB;
  try{
    await firestoreDb.runTransaction(async tx=>{
      const snap = await tx.get(fsDoc);
      const remote = snap.exists ? snap.data() : null;
      const remoteUpdatedAt = remote ? (remote.updatedAt||0) : 0;
      if(!force && remote && remoteUpdatedAt > lastKnownRemoteUpdatedAt){
        const err = new Error('conflict'); err.isConflict = true; err.remote = remote;
        throw err;
      }
      tx.set(fsDoc, snapshotToPush);
    });
    lastKnownRemoteUpdatedAt = snapshotToPush.updatedAt;
    lastPushedUpdatedAt = snapshotToPush.updatedAt;
    dailyBackupIfNeeded();
    updateSyncIndicator();
    return {ok:true};
  }catch(e){
    if(e && e.isConflict) return {ok:false, conflict:true, remote:e.remote};
    return {ok:false, reason:e.message||'Could not reach the cloud right now.'};
  }
}
async function forcePushToCloud(force){
  return safePushToCloud(force);
}

/* Sidebar footer indicator: makes it obvious at a glance whether this device's changes
   have actually reached the cloud yet, since pushing is no longer automatic. */
let lastPushedUpdatedAt = 0;
function updateSyncIndicator(){
  if(!SYNC_ENABLED || !currentUser) return;
  const foot = document.getElementById('sbFoot');
  if(!foot) return;
  const hasUnpushed = (DB.updatedAt||0) > lastPushedUpdatedAt;
  const signOutHtml = `<br><a href="#" id="signOutLink" style="color:#3ED9A0;">Sign out</a>`;

  } else {
    foot.innerHTML = `<span style="color:#34D399;">● Synced</span> · ${currentUser.email}${signOutHtml}`;
  }

}

/* ---------------- data store ---------------- */
const DB_KEY = 'ledger_portfolio_v1';
function migrateStockArray(arr){
  // merges duplicate-symbol rows into one holding with multiple "lots", and
  // upgrades any legacy flat {qty,buyPrice,buyDate} row into the lots shape.
  const bySymbol = {};
  (arr||[]).forEach(h=>{
    const sym = (h.symbol||'').toUpperCase();
    if(!sym) return;
    if(!bySymbol[sym]) bySymbol[sym] = { id: h.id||uid(), symbol: sym, lots: [], lastPrice: null, priceLive: null };
    const target = bySymbol[sym];
    if(Array.isArray(h.lots)) target.lots.push(...h.lots);
    else target.lots.push({ id: uid(), qty: h.qty, buyPrice: h.buyPrice, buyDate: h.buyDate });
    if(h.lastPrice){ target.lastPrice = h.lastPrice; target.priceLive = h.priceLive; }
  });
  return Object.values(bySymbol);
}
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  let db;
  if(raw){ try{ db = JSON.parse(raw); }catch(e){} }
  if(!db) db = { instocks:[], usstocks:[], mf:[], ppf:[], epf:[], post:[], priceCache:{} };
  const beforeCount = (db.instocks||[]).length + (db.usstocks||[]).length;
  db.instocks = migrateStockArray(db.instocks);
  db.usstocks = migrateStockArray(db.usstocks);
  const afterCount = db.instocks.length + db.usstocks.length;
  if(afterCount !== beforeCount){
    // migration merged duplicate-symbol rows — persist the cleaned shape immediately
    // so it doesn't wait for the next unrelated save (and syncs to other devices sooner)
    try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){}
  }
  return db;
}
function saveDB(){
  DB.updatedAt = Date.now();
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  updateSyncIndicator();
  // NOTE: this intentionally does NOT push to the cloud automatically. Cloud updates
  // happen only when you click "Push to Cloud Now" — see forcePushToCloud(). This is
  // deliberate: automatic background pushes were the root cause of repeated data loss
  // from stale/idle sessions overwriting newer cloud data. Local storage on this device
  // is always saved instantly and safely; the cloud only changes when you say so.
}
let DB = loadDB();

function uid(){ return Math.random().toString(36).slice(2,9); }
function holdingQty(h){ return (h.lots||[]).reduce((s,l)=>s+l.qty,0); }
function holdingInvested(h){ return (h.lots||[]).reduce((s,l)=>s+l.qty*l.buyPrice,0); }
function holdingAvgPrice(h){ const q=holdingQty(h); return q>0 ? holdingInvested(h)/q : 0; }
function holdingCurrent(h){ return holdingQty(h)*(h.lastPrice||holdingAvgPrice(h)); }
function addStockLot(key, symbol, qty, buyPrice, buyDate){
  symbol = (symbol||'').toUpperCase();
  let h = DB[key].find(x=>x.symbol===symbol);
  if(!h){ h = {id:uid(), symbol, lots:[], lastPrice:null, priceLive:null}; DB[key].push(h); }
  h.lots.push({id:uid(), qty, buyPrice, buyDate});
  return h;
}
function fmtINR(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const neg = n<0; n=Math.abs(n);
  const fixed = n.toFixed(2);
  const [intPart, decPart] = fixed.split('.');
  let lastThree = intPart.substring(intPart.length-3), other = intPart.substring(0,intPart.length-3);
  if(other!=='') lastThree = ',' + lastThree;
  const formatted = other.replace(/\B(?=(\d{2})+(?!\d))/g,',') + lastThree;
  return (neg?'-':'') + '₹' + formatted + '.' + decPart;
}
function fmtUSD(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtPct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (n>=0?'+':'')+n.toFixed(2)+'%'; }
function daysBetween(a,b){ return (new Date(b)-new Date(a))/(1000*60*60*24); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const parts = String(dateStr).slice(0,10).split('-');
  if(parts.length!==3) return dateStr;
  const [y,m,d] = parts;
  return `${d}/${m}/${y}`;
}

/* ---------------- XIRR / CAGR ---------------- */
function xirr(cashflows){
  // cashflows: [{date:'YYYY-MM-DD', amount:number}] negative=invested, positive=inflow/current value
  if(cashflows.length<2) return null;
  const d0 = new Date(cashflows[0].date);
  function npv(rate){
    return cashflows.reduce((s,cf)=> s + cf.amount / Math.pow(1+rate, daysBetween(d0,cf.date)/365), 0);
  }
  function dnpv(rate){
    return cashflows.reduce((s,cf)=>{
      const t = daysBetween(d0,cf.date)/365;
      return s - t*cf.amount / Math.pow(1+rate, t+1);
    },0);
  }
  let rate = 0.15;
  for(let i=0;i<80;i++){
    const f = npv(rate), fp = dnpv(rate);
    if(Math.abs(fp)<1e-9) break;
    const next = rate - f/fp;
    if(!isFinite(next)) break;
    if(Math.abs(next-rate)<1e-7){ rate=next; break; }
    rate = Math.max(-0.99, next);
  }
  if(!isFinite(rate) || rate < -0.99) return null;
  return rate*100;
}
function cagr(begin, end, years){
  if(begin<=0||years<=0) return null;
  return (Math.pow(end/begin, 1/years)-1)*100;
}

/* ---------------- live price fetch (via CORS proxy, cached fallback) ---------------- */
const PROXY = u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u);

async function fetchYahooQuote(symbol){
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}`;
  try{
    const res = await fetch(PROXY(url), {cache:'no-store'});
    if(!res.ok) throw new Error('bad response');
    const j = await res.json();
    const price = j?.chart?.result?.[0]?.meta?.regularMarketPrice;
    if(typeof price !== 'number') throw new Error('no price');
    DB.priceCache[symbol] = {price, ts:Date.now()};
    saveDB();
    return {price, live:true};
  }catch(e){
    const cached = DB.priceCache[symbol];
    if(cached) return {price:cached.price, live:false, ts:cached.ts};
    return {price:null, live:false};
  }
}
async function fetchMFNav(schemeCode){
  const url = `https://api.mfapi.in/mf/${encodeURIComponent(schemeCode)}/latest`;
  try{
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('bad');
    const j = await res.json();
    const nav = parseFloat(j?.data?.[0]?.nav);
    const date = j?.data?.[0]?.date;
    if(!nav) throw new Error('no nav');
    DB.priceCache['mf_'+schemeCode] = {price:nav, ts:Date.now(), navDate:date};
    saveDB();
    return {nav, live:true, navDate:date};
  }catch(e){
    const cached = DB.priceCache['mf_'+schemeCode];
    if(cached) return {nav:cached.price, live:false, navDate:cached.navDate};
    return {nav:null, live:false};
  }
}
const mfHistoryCache = {}; // in-memory only, per session
async function fetchMFNavOnDate(schemeCode, dateStr){
  // returns the NAV on (or nearest prior trading day to) a given date, for backdated Excel imports
  try{
    if(!mfHistoryCache[schemeCode]){
      const res = await fetch(`https://api.mfapi.in/mf/${encodeURIComponent(schemeCode)}`, {cache:'no-store'});
      if(!res.ok) throw new Error('bad');
      const j = await res.json();
      mfHistoryCache[schemeCode] = (j?.data||[]).map(d=>({date: d.date.split('-').reverse().join('-'), nav: parseFloat(d.nav)})); // AMFI uses DD-MM-YYYY
    }
    const hist = mfHistoryCache[schemeCode];
    const target = new Date(dateStr);
    let best = null;
    for(const h of hist){ const hd = new Date(h.date); if(hd<=target && (!best || hd>new Date(best.date))) best = h; }
    return best ? best.nav : (hist[0]? hist[0].nav : null);
  }catch(e){ return null; }
}


/* ---------------- USD → INR historical conversion ---------------- */
const DEFAULT_USD_INR = 83; // fallback only, used until a real rate is fetched for that date
const sessionTriedFx = new Set(); // dates attempted this session — avoids retry loops if the FX API is down
function getCachedFxRate(dateStr){
  const c = DB.priceCache['fx_'+dateStr];
  return c ? c.price : null;
}
async function fetchFxRate(dateStr){
  const cached = getCachedFxRate(dateStr);
  if(cached) return {rate:cached, live:true};
  try{
    const res = await fetch(`https://api.exchangerate.host/${dateStr}?base=USD&symbols=INR`, {cache:'no-store'});
    if(!res.ok) throw new Error('bad');
    const j = await res.json();
    const rate = j?.rates?.INR;
    if(typeof rate !== 'number') throw new Error('no rate');
    DB.priceCache['fx_'+dateStr] = {price:rate, ts:Date.now()};
    saveDB();
    return {rate, live:true};
  }catch(e){
    return {rate:null, live:false};
  }
}

/* ================= DASHBOARD ================= */
function usdInvestedInInr(h){
  return (h.lots||[]).reduce((s,l)=>{
    const rate = getCachedFxRate(l.buyDate) || DEFAULT_USD_INR;
    return s + l.qty*l.buyPrice*rate;
  },0);
}
function usdCurrentInInr(h){
  const rate = getCachedFxRate(todayStr()) || DEFAULT_USD_INR;
  return holdingQty(h)*(h.lastPrice||holdingAvgPrice(h))*rate;
}
async function ensureFxRatesLoaded(){
  const dates = new Set([todayStr()]);
  DB.usstocks.forEach(h=>(h.lots||[]).forEach(l=>dates.add(l.buyDate)));
  let changed=false;
  for(const d of dates){
    if(getCachedFxRate(d) || sessionTriedFx.has(d)) continue;
    sessionTriedFx.add(d);
    const r = await fetchFxRate(d);
    if(r.rate) changed=true;
  }
  if(changed) renderAll();
}
function allHoldingsFlat(){
  // returns {invested, current, xirrFlows[], byType:{}} — all figures in INR.
  // US stock amounts are converted using the FX rate on each transaction's own date (for "invested")
  // and today's rate (for "current"), falling back to an approximate default until real rates load.
  const flows = [];
  let invested=0, current=0;
  const byType = {};
  function add(type, inv, cur){ byType[type]=(byType[type]||0)+cur; invested+=inv; current+=cur; }

  DB.instocks.forEach(h=>{
    const inv = holdingInvested(h);
    const cur = holdingCurrent(h);
    add('Indian Stocks & ETFs', inv, cur);
    (h.lots||[]).forEach(l=> flows.push({date:l.buyDate, amount:-(l.qty*l.buyPrice)}));
  });
  DB.usstocks.forEach(h=>{
    const inv = usdInvestedInInr(h);
    const cur = usdCurrentInInr(h);
    add('US Stocks & ETFs', inv, cur);
    (h.lots||[]).forEach(l=>{
      const rate = getCachedFxRate(l.buyDate) || DEFAULT_USD_INR;
      flows.push({date:l.buyDate, amount:-(l.qty*l.buyPrice*rate)});
    });
  });
  DB.mf.forEach(f=>{
    let units=0, inv=0;
    f.entries.forEach(e=>{ units += e.units; inv += e.amount; flows.push({date:e.date, amount:-e.amount}); });
    const cur = units*(f.lastNav||0);
    add('Mutual Funds', inv, cur);
  });
  ['ppf','epf'].forEach(k=>{
    let bal=0, inv=0;
    DB[k].forEach(e=>{ bal += e.amount + (e.interest||0); inv += e.amount; flows.push({date:e.date, amount:-e.amount}); });
    add(k==='ppf'?'PPF':'EPF', inv, bal);
  });
  DB.post.forEach(scheme=>{
    let bal=0, inv=0;
    scheme.entries.forEach(e=>{ bal += e.amount + (e.interest||0); inv += e.amount; flows.push({date:e.date, amount:-e.amount}); });
    add('Post Office', inv, bal);
  });

  if(current>0) flows.push({date:todayStr(), amount:current});
  return {invested, current, flows, byType};
}

function monthKey(d){ const dt=new Date(d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function monthLabel(k){ const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleString('en-US',{month:'short',year:'2-digit'}); }

function investedByMonth(){
  const flows = [];
  DB.instocks.forEach(h=>(h.lots||[]).forEach(l=>flows.push({date:l.buyDate, amount:l.qty*l.buyPrice})));
  DB.usstocks.forEach(h=>(h.lots||[]).forEach(l=>{
    const rate = getCachedFxRate(l.buyDate) || DEFAULT_USD_INR;
    flows.push({date:l.buyDate, amount:l.qty*l.buyPrice*rate});
  }));
  DB.mf.forEach(f=>f.entries.forEach(e=>flows.push({date:e.date, amount:e.amount})));
  DB.ppf.forEach(e=>flows.push({date:e.date, amount:e.amount}));
  DB.epf.forEach(e=>flows.push({date:e.date, amount:e.amount}));
  DB.post.forEach(s=>s.entries.forEach(e=>flows.push({date:e.date, amount:e.amount})));
  if(flows.length===0) return {labels:[], invested:[], value:[]};
  flows.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const first = new Date(flows[0].date);
  const now = new Date();
  const months = [];
  let cur = new Date(first.getFullYear(), first.getMonth(), 1);
  while(cur<=now){ months.push(monthKey(cur)); cur.setMonth(cur.getMonth()+1); }
  const investedByM = {};
  flows.forEach(f=>{ const k=monthKey(f.date); investedByM[k]=(investedByM[k]||0)+f.amount; });
  let running=0;
  const investedCum = months.map(m=>{ running += (investedByM[m]||0); return running; });

  // approximate value trajectory: scale today's actual current value by how much of your total
  // investment had been made by each month (a proportional approximation, not a historical price feed)
  const {current} = allHoldingsFlat();
  const n = months.length;
  const totalInvested = investedCum[n-1] || 0;
  const valueCum = investedCum.map(v=> totalInvested>0 ? current * (v/totalInvested) : 0);
  return {labels:months.map(monthLabel), invested:investedCum, value:valueCum};
}

function computeProjection(flows, current, fixedRate){
  const blended = xirr(flows);
  const rate = (fixedRate!=null) ? fixedRate : ((blended && isFinite(blended)) ? Math.max(-5, blended) : 8);
  // average monthly contribution from actual entries
  const allDates = flows.filter(f=>f.amount<0).map(f=>f.date).sort();
  let months = 1;
  if(allDates.length>1) months = Math.max(1, Math.round(daysBetween(allDates[0], todayStr())/30.44));
  const totalInvested = -flows.filter(f=>f.amount<0).reduce((s,f)=>s+f.amount,0);
  const avgMonthly = totalInvested / months;

  const r = rate/100/12;
  function fv(monthsAhead){
    const growthOfCurrent = current * Math.pow(1+r, monthsAhead);
    const sip = avgMonthly>0 && r!==0 ? avgMonthly * ((Math.pow(1+r, monthsAhead)-1)/r) : avgMonthly*monthsAhead;
    return growthOfCurrent + sip;
  }
  return {
    rate, avgMonthly,
    points:[
      {label:'Now', value:current},
      {label:'5 yrs', value:fv(60)},
      {label:'10 yrs', value:fv(120)},
      {label:'20 yrs', value:fv(240)},
    ]
  };
}
function projectionSeries(){
  const {current, flows} = allHoldingsFlat();
  return computeProjection(flows, current);
}

const sessionTriedPrices = new Set(); // holding ids attempted this session (cleared only by manual refresh)
async function refreshStockPrices(key, currency, forceRetry){
  const btn = document.getElementById('refreshPrices');
  if(btn){ btn.textContent='Refreshing…'; btn.disabled=true; }
  let changed = false;
  for(const h of DB[key]){
    if(!forceRetry && sessionTriedPrices.has(h.id)) continue;
    sessionTriedPrices.add(h.id);
    const ySym = currency==='USD'? h.symbol : h.symbol+'.NS';
    const r = await fetchYahooQuote(ySym);
    if(r.price){ h.lastPrice = r.price; h.priceLive = r.live; changed = true; }
  }
  if(changed){ saveDB(); renderAll(); }
  else if(btn){ btn.textContent='Refresh Prices'; btn.disabled=false; }
}

      data:{ labels: proj.points.map(p=>p.label), datasets:[{ label:'Projected Value', data: proj.points.map(p=>p.value), borderColor:'#A78BFA', backgroundColor:'#A78BFA22', fill:true, tension:.35, borderWidth:2.5, pointRadius:5, pointBackgroundColor:'#A78BFA', pointBorderColor:'#0A0E16', pointBorderWidth:2 }]},
      options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>` ${fmtINR(ctx.raw)}`}}}, scales:{ x:{grid:{display:false}, ticks:{color:'#8B96AC'}}, y:{grid:{color:'#ffffff0a'}, ticks:{color:'#8B96AC', callback:v=>fmtINR(v)}} } }
    });
  }

  window._mfExpanded = window._mfExpanded || new Set();
  mainEl.querySelectorAll('[data-mftoggle]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.mftoggle;
    if(window._mfExpanded.has(id)) window._mfExpanded.delete(id);
    else window._mfExpanded.add(id);
    renderAll();
  }));

  document.getElementById('mfExport').addEventListener('click', ()=>{
    const data = [];
    DB.mf.forEach(f=>f.entries.forEach(e=>data.push({ FundName:f.fundName, SchemeCode:f.schemeCode, Date:e.date, Amount:e.amount })));
    exportToExcel('mutual-funds.xlsx', 'Mutual Funds', data);
  });
  document.getElementById('mfImportFile').addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const rowsIn = await importFromExcel(file);
      let added = 0;
      for(const r of rowsIn){
        const fundName = String(r.FundName||r.fundName||r['Fund Name']||'').trim();
        const schemeCode = String(r.SchemeCode||r.schemeCode||r['Scheme Code']||'').trim();
        const date = excelDate(r.Date||r.date);
        const amount = parseFloat(r.Amount||r.amount);
        if(!fundName || !schemeCode || !amount) continue;
        let fund = DB.mf.find(x=>x.schemeCode===schemeCode);
        if(!fund){ fund = {id:uid(), fundName, schemeCode, entries:[], lastNav:null, navLive:null}; DB.mf.push(fund); }
        const nav = await fetchMFNavOnDate(schemeCode, date);
        const navFinal = nav || 100;
        fund.entries.push({ id:uid(), date, amount, navAtEntry:navFinal, units: navFinal? amount/navFinal : 0 });
        added++;
      }
      for(const f of DB.mf){ if(!f.lastNav){ const r=await fetchMFNav(f.schemeCode); if(r.nav){f.lastNav=r.nav; f.navLive=r.live;} } }
      saveDB(); renderAll();
      alert(`Imported ${added} entr${added===1?'y':'ies'}. Historical NAV was auto-matched by date. Columns expected: FundName, SchemeCode, Date, Amount.`);
    }catch(err){ alert('Could not read that file. Columns expected: FundName, SchemeCode, Date, Amount.'); }
  });
  document.getElementById('refreshNav').addEventListener('click', async ()=>{
    let changed=false;
    for(const f of DB.mf){ sessionTriedNav.add(f.id); const r = await fetchMFNav(f.schemeCode); if(r.nav){ f.lastNav=r.nav; f.navLive=r.live; changed=true; } }
    if(changed){ saveDB(); renderAll(); }
  });
  const needsNav = DB.mf.some(f=>!f.lastNav && !sessionTriedNav.has(f.id));
  if(needsNav){
    (async ()=>{
      let changed=false;
      for(const f of DB.mf){
        if(f.lastNav || sessionTriedNav.has(f.id)) continue;
        sessionTriedNav.add(f.id);
        const r = await fetchMFNav(f.schemeCode);
        if(r.nav){ f.lastNav=r.nav; f.navLive=r.live; changed=true; }
      }
      if(changed){ saveDB(); renderAll(); }
    })();
  }
}
const sessionTriedNav = new Set(); // fund ids attempted this session

/* ================= PPF / EPF (auto running balance) ================= */
// Official government-declared rates — PPF is reviewed quarterly by the Ministry of Finance
// (7.1% p.a. since April 2020, confirmed for Q2 FY 2026-27); EPF is reviewed annually by EPFO
// (8.25% p.a. for FY 2025-26). Update these if the government revises them.
const PPF_OFFICIAL_RATE = 7.1;
const EPF_OFFICIAL_RATE = 8.25;

function renderSimpleLedger(pageIdx, key, title, eyebrow){
  const page = PAGES[pageIdx];
  const rows = [...DB[key]].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let running=0;
  const withBalance = rows.map(e=>{ running += e.amount + (e.interest||0); return {...e, balance:running}; });
  const invested = rows.reduce((s,e)=>s+e.amount,0);

  const html = `
    <div class="page-head">
      <div><div class="page-eyebrow">${eyebrow}</div><div class="page-title">${title}</div><div class="page-sub">Running balance updates automatically from your entries.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${excelBtnsHtml('ledger')}</div>
    </div>
    <div class="stat-grid">
      <div class="card"><div class="stat-label">Total Deposited</div><div class="stat-value">${fmtINR(invested)}</div></div>
      <div class="card"><div class="stat-label">Current Balance</div><div class="stat-value">${fmtINR(running)}</div></div>
    </div>
    ${rows.length>0?`
    <div class="chart-card" style="margin-bottom:16px;">
      <h3>Projected Value — 5 / 10 / 20 years</h3>
      <div class="sub" id="ledgerProjSub"></div>
      <div class="chart-wrap"><canvas id="ledgerProjChart"></canvas></div>
    </div>`:''}
    <div class="panel">
      <div class="panel-head"><h3>History (${rows.length})</h3></div>
      ${rows.length===0?`<div class="empty-state"><b>No entries yet</b>Use the "Add Entry" tab to log your first ${title} deposit.</div>`:`
      <div class="table-scroll"><table><thead><tr><th>Date</th><th>Amount</th><th>Interest</th><th>Running Balance</th></tr></thead><tbody>
        ${withBalance.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${fmtINR(e.amount)}</td><td>${e.interest?fmtINR(e.interest):'—'}</td><td><b>${fmtINR(e.balance)}</b></td></tr>`).join('')}
      </tbody></table></div>`}
    </div>
  `;
  mainEl.innerHTML = pageShell(page, html);

  if(rows.length>0){
    const flows = rows.map(e=>({date:e.date, amount:-(e.amount)}));
    if(running>0) flows.push({date:todayStr(), amount:running});
    const officialRate = key==='ppf' ? PPF_OFFICIAL_RATE : EPF_OFFICIAL_RATE;
    const proj = computeProjection(flows, running, officialRate);
    document.getElementById('ledgerProjSub').textContent = `Official ${title} rate: ${officialRate.toFixed(2)}% p.a. (as currently declared${key==='ppf'?' by the Ministry of Finance, reviewed quarterly':' by EPFO, reviewed annually'}) · Avg. monthly contribution: ${fmtINR(proj.avgMonthly)}`;
    destroyChart('ledgerProj');
    const accentColor = key==='ppf' ? '#E0A83E' : '#FB7185';
    charts.ledgerProj = new Chart(document.getElementById('ledgerProjChart'), {
      type:'line',
      data:{ labels: proj.points.map(p=>p.label), datasets:[{ label:'Projected Value', data: proj.points.map(p=>p.value), borderColor:accentColor, backgroundColor:accentColor+'22', fill:true, tension:.35, borderWidth:2.5, pointRadius:5, pointBackgroundColor:accentColor, pointBorderColor:'#0A0E16', pointBorderWidth:2 }]},
      options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>` ${fmtINR(ctx.raw)}`}}}, scales:{ x:{grid:{display:false}, ticks:{color:'#8B96AC'}}, y:{grid:{color:'#ffffff0a'}, ticks:{color:'#8B96AC', callback:v=>fmtINR(v)}} } }
    });
  }

  document.getElementById('ledgerExport').addEventListener('click', ()=>{
    const data = rows.map(e=>({ Date:e.date, Amount:e.amount, Interest:e.interest||0 }));
    exportToExcel(`${key}-history.xlsx`, title, data);
  });
  document.getElementById('ledgerImportFile').addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const rowsIn = await importFromExcel(file);
      let added = 0;
      rowsIn.forEach(r=>{
        const amount = parseFloat(r.Amount||r.amount);
        if(!amount) return;
        const date = excelDate(r.Date||r.date);
        const interest = parseFloat(r.Interest||r.interest)||0;
        DB[key].push({id:uid(), date, amount, interest});
        added++;
      });
      saveDB(); renderAll();
      alert(`Imported ${added} entr${added===1?'y':'ies'}. Columns expected: Date, Amount, Interest.`);
    }catch(err){ alert('Could not read that file. Columns expected: Date, Amount, Interest.'); }
  });
}

    } else if(cat==='ppf' || cat==='epf'){
      const date = f.get('date'), amount = +f.get('amount'), interest = +f.get('interest')||0;
      DB[cat].push({id:uid(), date, amount, interest});
      detail = `${fmtINR(amount)}${interest?' + '+fmtINR(interest)+' interest':''} on ${date}`;
      saveDB();
    } else if(cat==='post'){
      const schemeName = f.get('schemeName').trim(), date = f.get('date'), amount = +f.get('amount'), interest = +f.get('interest')||0;
      let scheme = DB.post.find(s=>s.schemeName.toLowerCase()===schemeName.toLowerCase());
      if(!scheme){
        scheme = { id:uid(), schemeName, maturityDate: f.get('maturityDate')||null, rate: +f.get('rate')||null, entries:[] };
        DB.post.push(scheme);
      }
      scheme.entries.push({ id:uid(), date, amount, interest });
      detail = `${schemeName} · ${fmtINR(amount)} on ${date}`;
      saveDB();
    }

    window._entryCat = cat;
    window._editingRef = null;
    renderAll();
    const fb = document.getElementById('entryFeedback');
    if(fb){ fb.style.display='block'; fb.textContent = `${wasEditing?'Updated':'Added'}: ${detail}`; }
  });

  function wireEntryListButtons(){
    mainEl.querySelectorAll('[data-editref]').forEach(b=>b.addEventListener('click',()=>{
      window._editingRef = b.dataset.editref;
      const data = getEntryDataByRef(window._editingRef);
      window._entryCat = data.cat;
      renderAll();
    }));
    mainEl.querySelectorAll('[data-delany]').forEach(b=>b.addEventListener('click', async ()=>{
      const ok = await confirmModal('Remove this entry? This can\'t be undone.');
      if(!ok) return;
      deleteByRef(b.dataset.delany);
      saveDB(); renderAll();
    }));
  }
}

function entriesListHtml(filterText){

      `<div class="table-scroll"><table><thead><tr><th>Category</th><th>Detail</th><th>Date</th><th></th></tr></thead><tbody>
        ${filtered.map(e=>`<tr><td class="name">${e.cat}</td><td>${e.detail}</td><td>${fmtDate(e.date)}</td><td><button class="btn tiny ghost" data-editref="${e.ref}">Edit</button> <button class="btn tiny danger" data-delany="${e.ref}">Remove</button></td></tr>`).join('')}
      </tbody></table></div>`}

}

function getEntryDataByRef(ref){
  const [kind, ...rest] = ref.split(':');
  if(kind==='lot'){
    const [key, holdingId, lotId] = rest;
    const h = DB[key].find(x=>x.id===holdingId);
    const l = h?.lots.find(x=>x.id===lotId);
    return { cat:key, prefill: l? {symbol:h.symbol, qty:l.qty, buyPrice:l.buyPrice, buyDate:l.buyDate} : {} };
  }
  if(kind==='mf'){
    const [fundId, entryId] = rest;
    const fund = DB.mf.find(x=>x.id===fundId);
    const e = fund?.entries.find(x=>x.id===entryId);
    return { cat:'mf', prefill: e? {fundName:fund.fundName, schemeCode:fund.schemeCode, date:e.date, amount:e.amount} : {} };
  }
  if(kind==='simple'){
    const [key, entryId] = rest;
    const e = DB[key].find(x=>x.id===entryId);
    return { cat:key, prefill: e? {date:e.date, amount:e.amount, interest:e.interest} : {} };
  }
  if(kind==='post'){
    const [schemeId, entryId] = rest;
    const scheme = DB.post.find(x=>x.id===schemeId);
    const e = scheme?.entries.find(x=>x.id===entryId);
    return { cat:'post', prefill: e? {schemeName:scheme.schemeName, date:e.date, amount:e.amount, interest:e.interest, maturityDate:scheme.maturityDate, rate:scheme.rate} : {} };
  }
  return { cat:'instocks', prefill:{} };
}

function deleteByRef(ref){
  const [kind, ...rest] = ref.split(':');
  if(kind==='lot'){
    const [key, holdingId, lotId] = rest;
    const h = DB[key].find(x=>x.id===holdingId);
    if(h){ h.lots = h.lots.filter(l=>l.id!==lotId); if(h.lots.length===0) DB[key] = DB[key].filter(x=>x.id!==holdingId); }
  } else if(kind==='mf'){
    const [fundId, entryId] = rest;
    const fund = DB.mf.find(x=>x.id===fundId);
    if(fund){ fund.entries = fund.entries.filter(e=>e.id!==entryId); if(fund.entries.length===0) DB.mf = DB.mf.filter(x=>x.id!==fundId); }
  } else if(kind==='simple'){
    const [key, entryId] = rest;
    DB[key] = DB[key].filter(e=>e.id!==entryId);
  } else if(kind==='post'){
    const [schemeId, entryId] = rest;
    const scheme = DB.post.find(s=>s.id===schemeId);
    if(scheme){ scheme.entries = scheme.entries.filter(e=>e.id!==entryId); }
  }
}

function allEntriesFlat(){
  const out = [];
  DB.instocks.forEach(h=>(h.lots||[]).forEach(l=>out.push({
    cat:'Indian Stock/ETF', detail:`${h.symbol} · ${l.qty} @ ${fmtINR(l.buyPrice)}`, date:l.buyDate, ref:`lot:instocks:${h.id}:${l.id}`
  })));
  DB.usstocks.forEach(h=>(h.lots||[]).forEach(l=>out.push({
    cat:'US Stock/ETF', detail:`${h.symbol} · ${l.qty} @ ${fmtUSD(l.buyPrice)}`, date:l.buyDate, ref:`lot:usstocks:${h.id}:${l.id}`
  })));
  DB.mf.forEach(fund=>fund.entries.forEach(e=>out.push({
    cat:'Mutual Fund', detail:`${fund.fundName} · ${fmtINR(e.amount)}`, date:e.date, ref:`mf:${fund.id}:${e.id}`
  })));
  DB.ppf.forEach(e=>out.push({ cat:'PPF', detail:`${fmtINR(e.amount)}${e.interest?' + '+fmtINR(e.interest)+' interest':''}`, date:e.date, ref:`simple:ppf:${e.id}` }));
  DB.epf.forEach(e=>out.push({ cat:'EPF', detail:`${fmtINR(e.amount)}${e.interest?' + '+fmtINR(e.interest)+' interest':''}`, date:e.date, ref:`simple:epf:${e.id}` }));
  DB.post.forEach(s=>s.entries.forEach(e=>out.push({
    cat:'Post Office', detail:`${s.schemeName} · ${fmtINR(e.amount)}`, date:e.date, ref:`post:${s.id}:${e.id}`
  })));
  out.sort((a,b)=> new Date(b.date) - new Date(a.date));
  return out;
}

/* ================= DEBT MODULE — engine =================
   Everything debt-related lives under DB.debt (one self-contained namespace).
   Nothing in this module writes any investment key, and no investment code touches DB.debt.
   The only investment access is one READ-ONLY call to allHoldingsFlat() for net worth. */

const DEBT_EPS = 0.005;
const DEBT_COLORS = ['#F87171','#FB923C','#FBBF24','#34D399','#4C8DFF','#A78BFA','#F472B6','#22D3EE','#94A3B8'];
const DEBT_CATEGORIES = {gold:'Gold loan', loan:'Loan', friend:'Friend / family', card:'Credit card', other:'Other'};
function dClamp01(x){ return Math.max(0, Math.min(1, x)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- month helpers (all "YYYY-MM") ---- */
function ymNow(){ return todayStr().slice(0,7); }
function addMonthsYM(ym, n){
  const [y,m] = ym.split('-').map(Number);
  const t = y*12 + (m-1) + n;
  return `${Math.floor(t/12)}-${String(t%12+1).padStart(2,'0')}`;
}
function lastDayOfYM(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);
}
function ymLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, 1)).toLocaleString('en-US',{month:'short', year:'2-digit', timeZone:'UTC'});
}
function diffMD(fromStr, toStr){
  const f = new Date(fromStr+'T00:00:00Z'), t = new Date(toStr+'T00:00:00Z');
  let months = (t.getUTCFullYear()-f.getUTCFullYear())*12 + (t.getUTCMonth()-f.getUTCMonth());
  let anchor = new Date(Date.UTC(f.getUTCFullYear(), f.getUTCMonth()+months, f.getUTCDate()));
  if(anchor > t){ months--; anchor = new Date(Date.UTC(f.getUTCFullYear(), f.getUTCMonth()+months, f.getUTCDate())); }
  if(months < 0) months = 0;
  return { months, days: Math.max(0, Math.round((t-anchor)/86400000)), totalDays: Math.max(0, Math.round((t-f)/86400000)) };
}

/* ---- state ---- */
function seedDebtState(){
  const y = new Date().getFullYear();
  const today = todayStr();
  const base = { priorPaid:0, monthlyPayment:null, schedule:[], startDate:today };
  return {
    seeded: true,
    debts: [
      {...base, id:'d_muthoot',    name:'Gold – Muthoot Finance', category:'gold',   openingBalance:224000, rate:0.87, ratePeriod:'month'},
      {...base, id:'d_iob',        name:'Gold – IOB',             category:'gold',   openingBalance:100000, rate:8.5,  ratePeriod:'year'},
      {...base, id:'d_society',    name:'Gold – Society',         category:'gold',   openingBalance:33000,  rate:8,    ratePeriod:'year'},
      {...base, id:'d_loan',       name:'Loan',                   category:'loan',   openingBalance:12442,  rate:0,    ratePeriod:'year',
        schedule:[{month:`${y}-10`, amount:5500},{month:`${y}-11`, amount:5500},{month:`${y}-12`, amount:1442}]},
      {...base, id:'d_purus',      name:'Friend 1 (Purus)',       category:'friend', openingBalance:70000,  priorPaid:20000, rate:0, ratePeriod:'year', monthlyPayment:10000},
      {...base, id:'d_rathinavel', name:'Friend 2 (Rathinavel)',  category:'friend', openingBalance:25000,  rate:0,    ratePeriod:'year'},
    ],
    payments: [], assets: [], snapshots: [],
    settings: { monthlyBudget:null, plan:'recommended' }
  };
}
function getDebt(){
  if(!DB.debt || !Array.isArray(DB.debt.debts)) DB.debt = seedDebtState();
  const D = DB.debt;
  if(!Array.isArray(D.payments)) D.payments = [];
  if(!Array.isArray(D.assets)) D.assets = [];
  if(!Array.isArray(D.snapshots)) D.snapshots = [];
  if(!D.settings) D.settings = { monthlyBudget:null, plan:'recommended' };
  return D;
}

/* ---- per-debt maths ---- */
function monthlyRateOf(d){ const r=(+d.rate||0)/100; return d.ratePeriod==='month' ? r : r/12; }
function annualRateOf(d){ const r=(+d.rate||0); return d.ratePeriod==='month' ? r*12 : r; }

// interest accrued day by day from the tracking start date, replaying principal payments
function accruedInterest(d, principalPayments, asOf){
  const annual = annualRateOf(d)/100;
  if(annual <= 0) return 0;
  let bal = Math.max(0, (+d.openingBalance||0) - (+d.priorPaid||0));
  const start = d.startDate || asOf;
  if(start >= asOf) return 0;
  let cursor = start, acc = 0;
  for(const p of principalPayments){
    let pd = p.date; if(pd < cursor) pd = cursor; if(pd > asOf) pd = asOf;
    acc += bal*annual/365*daysBetween(cursor, pd);
    bal = Math.max(0, bal - p.amount);
    cursor = pd;
  }
  acc += bal*annual/365*daysBetween(cursor, asOf);
  return acc;
}
function debtState(d, payments, asOf){
  asOf = asOf || todayStr();
  const mine = payments.filter(p=>p.debtId===d.id && p.date<=asOf).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const principal = mine.filter(p=>p.type!=='interest');
  const principalPaid = principal.reduce((s,p)=>s+(+p.amount||0),0);
  const interestPaid = mine.filter(p=>p.type==='interest').reduce((s,p)=>s+(+p.amount||0),0);
  const opening = +d.openingBalance||0, prior = +d.priorPaid||0;
  const startBalance = Math.max(0, opening - prior);
  const balance = Math.max(0, startBalance - principalPaid);
  const accrued = accruedInterest(d, principal, asOf);
  const interestDue = Math.max(0, accrued - interestPaid);
  const repaid = Math.min(opening, prior + principalPaid);
  const progress = balance <= DEBT_EPS ? 100 : (opening>0 ? Math.min(100, repaid/opening*100) : 0);
  return { balance, principalPaid, interestPaid, accrued, interestDue, progress, opening, repaid, startBalance };
}
// the minimum due in calendar month `ym` (works on a debt record or a simulation item)
function debtMinPayment(d, ym, monthInterest){
  if(Array.isArray(d.schedule) && d.schedule.length){
    const s = d.schedule.find(x=>x.month===ym);
    return s ? (+s.amount||0) : 0;
  }
  if(+d.monthlyPayment > 0) return +d.monthlyPayment;
  return monthInterest > 0 ? monthInterest : 0;   // gold loans: interest-only; interest-free: nothing
}

/* ---- Snowball / Avalanche simulation (pure: no DB access, so it can be tested in isolation) ---- */
function strategyOrder(list, strategy){
  const arr = [...list];
  if(strategy === 'snowball') arr.sort((a,b)=> (a.bal-b.bal) || (b.annualRate-a.annualRate));
  else arr.sort((a,b)=> (b.annualRate-a.annualRate) || (a.bal-b.bal));
  return arr;
}
function simulatePlan(debtsIn, opts){
  const strategy = opts.strategy === 'snowball' ? 'snowball' : 'avalanche';
  const maxM = opts.maxMonths || 600;
  const ds = debtsIn.filter(d=>d.balance > DEBT_EPS).map(d=>({
    id:d.id, name:d.name, bal:d.balance, monthlyRate:d.monthlyRate, annualRate:d.annualRate,
    monthlyPayment:d.monthlyPayment, schedule:d.schedule, paidThisMonth:d.paidThisMonth||0,
    interestIncurred:0, paid:0, closedYM:null
  }));
  let ym = opts.startYM;
  const startTotal = ds.reduce((s,d)=>s+d.bal,0);
  const mins0 = ds.reduce((s,d)=>s+debtMinPayment(d, ym, d.bal*d.monthlyRate),0);
  const baseBudget = (opts.budget!=null && opts.budget>0) ? opts.budget : mins0;
  const timeline = [];
  let totalInterest = 0, totalPaid = 0;
  for(let m=0; m<maxM; m++){
    const active = ds.filter(d=>d.bal > DEBT_EPS);
    if(!active.length) break;
    let monthInterest = 0;
    active.forEach(d=>{ d._i = d.bal*d.monthlyRate; d.bal += d._i; d.interestIncurred += d._i; monthInterest += d._i; });
    const pay = {}, mins = {};
    let minsSum = 0;
    active.forEach(d=>{
      let min = debtMinPayment(d, ym, d._i);
      if(m === 0) min = Math.max(0, min - d.paidThisMonth);
      min = Math.min(min, d.bal);
      pay[d.id] = min; mins[d.id] = min; minsSum += min;
    });
    let budget = baseBudget;
    if(m === 0) budget = Math.max(0, baseBudget - (opts.paidThisMonthTotal||0));
    let extra = Math.max(0, budget - minsSum);        // if the budget is below the minimums, the minimums are still paid
    for(const d of strategyOrder(active, strategy)){
      if(extra <= DEBT_EPS) break;
      const room = d.bal - pay[d.id];
      if(room <= DEBT_EPS) continue;
      const add = Math.min(extra, room);
      pay[d.id] += add; extra -= add;
    }
    let paidMonth = 0;
    active.forEach(d=>{
      d.bal -= pay[d.id]; d.paid += pay[d.id]; paidMonth += pay[d.id];
      if(d.bal <= DEBT_EPS){ d.bal = 0; d.closedYM = ym; }
    });
    totalInterest += monthInterest; totalPaid += paidMonth;
    timeline.push({ ym, interest:monthInterest, paid:paidMonth, balance:ds.reduce((s,d)=>s+d.bal,0), pay:{...pay}, mins:{...mins} });
    ym = addMonthsYM(ym, 1);
  }
  const open = ds.filter(d=>d.bal > DEBT_EPS);
  const closures = ds.filter(d=>d.closedYM).map(d=>({id:d.id, name:d.name, ym:d.closedYM}))
                     .sort((a,b)=>a.ym<b.ym?-1:a.ym>b.ym?1:0);
  const closureById = {}; closures.forEach(c=>{ closureById[c.id] = c.ym; });
  const endYM = closures.length ? closures[closures.length-1].ym : null;
  return {
    strategy, debtFree: open.length===0, months: timeline.length, endYM,
    endDate: endYM ? lastDayOfYM(endYM) : null,
    totalInterest, totalPaid, timeline, closures, closureById, startTotal,
    baseBudget, minsAtStart: mins0, remaining: open.reduce((s,d)=>s+d.bal,0),
    names: Object.fromEntries(ds.map(d=>[d.id, d.name]))
  };
}
function recommendStrategy(sn, av){
  const diff = sn.totalInterest - av.totalInterest;      // > 0 means Avalanche is cheaper
  const monthsDiff = sn.months - av.months;
  let pick, reason;
  if(av.debtFree && !sn.debtFree){
    pick = 'avalanche'; reason = 'Only Avalanche clears every debt within 50 years at this monthly amount.';
  } else if(!av.debtFree && sn.debtFree){
    pick = 'snowball'; reason = 'Only Snowball clears every debt within 50 years at this monthly amount.';
  } else if(diff > 100){
    pick = 'avalanche';
    reason = `Avalanche pays the highest-interest debt first, so it costs ${fmtINR(diff)} less interest` +
             (monthsDiff>0 ? ` and finishes ${monthsDiff} month${monthsDiff>1?'s':''} sooner.` : '.');
  } else if(diff < -100){
    pick = 'snowball';
    reason = `Snowball costs ${fmtINR(-diff)} less interest here` + (monthsDiff<0 ? ` and finishes ${-monthsDiff} month${-monthsDiff>1?'s':''} sooner.` : '.');
  } else {
    pick = 'snowball';
    reason = 'Both methods cost almost the same interest, so Snowball is recommended — it clears the smallest debts first for quick wins and fewer payments to track.';
  }
  return { pick, reason, interestDiff:diff, monthsDiff };
}

/* ---- plans for the current state of the debts ---- */
function debtThisMonthPaid(debtId, ym, today){
  return getDebt().payments.filter(p=>(!debtId || p.debtId===debtId) && p.date.slice(0,7)===ym && p.date<=today)
                           .reduce((s,p)=>s+(+p.amount||0),0);
}
function debtPlanInputs(){
  const D = getDebt(), today = todayStr(), ym = today.slice(0,7);
  return D.debts.map(d=>{
    const st = debtState(d, D.payments, today);
    return { id:d.id, name:d.name, balance:st.balance, monthlyRate:monthlyRateOf(d), annualRate:annualRateOf(d),
             monthlyPayment:+d.monthlyPayment||0, schedule:d.schedule||[], paidThisMonth:debtThisMonthPaid(d.id, ym, today) };
  }).filter(x=>x.balance > DEBT_EPS);
}
function computePlans(){
  const D = getDebt(), ym = ymNow();
  const inputs = debtPlanInputs();
  const budget = (+D.settings.monthlyBudget > 0) ? +D.settings.monthlyBudget : null;
  const opts = { budget, startYM:ym, paidThisMonthTotal: debtThisMonthPaid(null, ym, todayStr()) };
  const snowball  = simulatePlan(inputs, {...opts, strategy:'snowball'});
  const avalanche = simulatePlan(inputs, {...opts, strategy:'avalanche'});
  const recommended = recommendStrategy(snowball, avalanche);
  const chosen = D.settings.plan==='snowball' ? 'snowball' : D.settings.plan==='avalanche' ? 'avalanche' : recommended.pick;
  return { inputs, snowball, avalanche, recommended, activeStrategy:chosen, active: chosen==='snowball'?snowball:avalanche, budgetIsAuto: budget===null };
}
function buildDebtRows(plans){
  const D = getDebt(), today = todayStr(), ym = today.slice(0,7);
  const rank = {};
  strategyOrder(plans.inputs.map(i=>({id:i.id, bal:i.balance, annualRate:i.annualRate})), plans.activeStrategy)
    .forEach((x,i)=>{ rank[x.id] = i+1; });
  return D.debts.map((d,idx)=>{
    const st = debtState(d, D.payments, today);
    const minFull = st.balance > DEBT_EPS ? debtMinPayment(d, ym, st.balance*monthlyRateOf(d)) : 0;
    const paidMonth = debtThisMonthPaid(d.id, ym, today);
    let status = 'Active';
    if(st.balance <= DEBT_EPS) status = 'Closed';
    else if(minFull > DEBT_EPS) status = paidMonth >= minFull-DEBT_EPS ? 'Paid this month' : 'Due this month';
    return { d, st, idx, minFull, paidMonth, status,
             priority: st.balance > DEBT_EPS ? (rank[d.id]||null) : null,
             closeYM: plans.active.closureById[d.id] || null,
             color: DEBT_COLORS[idx % DEBT_COLORS.length],
             interestBearing: annualRateOf(d) > 0 };
  });
}
function debtTotals(rows){
  const total = rows.reduce((s,r)=>s+r.st.balance,0);
  const ib = rows.filter(r=>r.interestBearing).reduce((s,r)=>s+r.st.balance,0);
  const opening = rows.reduce((s,r)=>s+r.st.opening,0);
  const repaid = rows.reduce((s,r)=>s+r.st.repaid,0);
  const interestDue = rows.reduce((s,r)=>s+r.st.interestDue,0);
  const wRate = total>DEBT_EPS ? rows.reduce((s,r)=>s+r.st.balance*annualRateOf(r.d),0)/total : 0;
  return { total, interestBearing:ib, interestFree:total-ib, opening, repaid, interestDue, weightedRate:wRate,
           progress: opening>0 ? Math.min(100, repaid/opening*100) : (total<=DEBT_EPS?100:0) };
}
// READ-ONLY look at the investment side (current value of everything) plus manually entered assets
function debtAssets(){
  const D = getDebt();
  let invest = 0;
  try{ invest = allHoldingsFlat().current || 0; }catch(e){ invest = 0; }
  const other = D.assets.reduce((s,a)=>s+(+a.value||0),0);
  return { invest, other, total: invest+other };
}
function healthScore(t, assets, plan){
  if(t.total <= DEBT_EPS) return { score:100, rating:'Debt-free', color:'#34D399', factors:[] };
  const owed = t.total + t.interestDue;
  const ratio = assets.total>0 ? owed/assets.total : 99;
  const f1 = 35*dClamp01((1-ratio)/0.9);
  const f2 = 25*dClamp01(1 - t.weightedRate/18);
  const f3 = 20*dClamp01(t.progress/100);
  const f4 = plan.debtFree ? 20*dClamp01((60-plan.months)/54) : 0;
  const score = Math.round(f1+f2+f3+f4);
  const rating = score>=80 ? 'Excellent' : score>=65 ? 'Good' : score>=45 ? 'Fair' : 'Needs attention';
  const color = score>=80 ? '#34D399' : score>=65 ? '#3ED9A0' : score>=45 ? '#FBBF24' : '#F87171';
  return { score, rating, color, factors:[
    { label:'Debt vs. assets', pts:f1, max:35, note: assets.total>0 ? `You owe ${(ratio*100).toFixed(1)}% of what you own (investments + other assets).` : 'No assets recorded — add them in Debt Entry.' },
    { label:'Average interest rate', pts:f2, max:25, note:`Weighted average ${t.weightedRate.toFixed(2)}% p.a. across what you owe (lower is better).` },
    { label:'Repayment progress', pts:f3, max:20, note:`${t.progress.toFixed(2)}% of the original balances repaid so far.` },
    { label:'Time to debt-free', pts:f4, max:20, note: plan.debtFree ? `About ${plan.months} month${plan.months===1?'':'s'} at the current plan (6 months or less scores full marks).` : 'Not debt-free within 50 years at this monthly amount.' },
  ]};
}

/* ================= DEBT MODULE — pages ================= */
function dR2(n){ return Math.round(n*100)/100; }
function dOpt(value, label, sel){ return `<option value="${value}" ${sel?'selected':''}>${label}</option>`; }
function dPbar(pct){ const p = Math.max(0, Math.min(100, pct)); return `<div class="pbar"><i style="width:${p}%"></i></div>`; }
function dBadge(status){
  const cls = status==='Closed' ? 'dim' : status==='Paid this month' ? 'ok' : status==='Due this month' ? 'warn' : '';
  return `<span class="badge ${cls}">${status}</span>`;
}
function dRateText(d){
  const r = +d.rate||0;
  if(r <= 0) return 'Interest-free';
  return d.ratePeriod==='month' ? `${r.toFixed(2)}% / month <span class="tag">(${(r*12).toFixed(2)}% p.a.)</span>` : `${r.toFixed(2)}% p.a.`;
}
function dStratName(k){ return k==='snowball' ? 'Debt Snowball' : 'Debt Avalanche'; }
function dLineOpts(fmt){
  return { plugins:{ legend:{display:true, position:'bottom', labels:{color:'#8B96AC', font:{size:11}, boxWidth:10, padding:12}},
                     tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmt(ctx.raw)}`}} },
           scales:{ x:{grid:{display:false}, ticks:{color:'#8B96AC', font:{size:10}, maxTicksLimit:12}},
                    y:{grid:{color:'#ffffff0a'}, ticks:{color:'#8B96AC', font:{size:10}, callback:v=>fmt(v)}} },
           interaction:{intersect:false, mode:'index'} };
}

function dParseSchedule(txt){
  const list = [];
  if(!txt || !String(txt).trim()) return {ok:true, list};
  for(const part of String(txt).split(/[,\n;]+/)){
    const m = part.trim().match(/^(\d{4}-\d{2})\s*[=:]\s*([\d.]+)$/);
    if(!m) return {ok:false};
    const mm = +m[1].slice(5);
    if(mm<1 || mm>12) return {ok:false};
    list.push({month:m[1], amount:parseFloat(m[2])});
  }
  return {ok:true, list};
}
function dScheduleText(s){ return (s||[]).map(x=>`${x.month}=${x.amount}`).join(', '); }

function dEntriesFlat(){

  D.debts.forEach(d=>out.push({kind:'debt', id:d.id, cat:'Debt', text:d.name, date:d.startDate||'',

    out.push({kind:'payment', id:p.id, cat:'Payment', text:d?d.name:'', date:p.date,
      detail:`${esc(d?d.name:'(removed debt)')} · ${fmtINR(p.amount)} ${p.type==='interest'?'interest':'principal'}`}); });
  D.assets.forEach(a=>out.push({kind:'asset', id:a.id, cat:'Asset', text:a.name, date:a.date||'', detail:`${esc(a.name)} · ${fmtINR(a.value)}`}));

      window._dEditing = {kind:k, id}; window._dKind = k; renderAll();
    }));
    mainEl.querySelectorAll('[data-ddel]').forEach(b=>b.addEventListener('click', ()=>{
      const [k, id] = b.dataset.ddel.split(':');
      dRemove(k, id);
    }));
  }
  wireList();
  document.getElementById('debtSearch').addEventListener('input', e=>{
    window._dFilter = e.target.value;
    document.getElementById('debtEntriesWrap').innerHTML = dEntriesHtml(window._dFilter);
    wireList();
  });
  document.getElementById('debtKind').addEventListener('change', e=>{
    window._dKind = e.target.value; window._dEditing = null; renderAll();
  });
  const cancel = document.getElementById('dCancelEdit');
  if(cancel) cancel.addEventListener('click', ()=>{ window._dEditing = null; renderAll(); });

  document.getElementById('dBackupBtn').addEventListener('click', downloadFullBackup);
  if(SYNC_ENABLED){
    document.getElementById('dPushBtn').addEventListener('click', async ()=>{
      const ok = await confirmModal('Push everything on this device to the cloud right now? This will overwrite the cloud copy with whatever is currently showing here.');
      if(!ok) return;
      const btn = document.getElementById('dPushBtn');
      btn.textContent = 'Pushing…'; btn.disabled = true;
      let result = await forcePushToCloud(false);
      if(result.conflict){
        btn.textContent = 'Push to Cloud Now'; btn.disabled = false;
        const proceed = await confirmModal('The cloud has changes made after this device last synced — likely from another tab or device. Overwriting now will permanently discard those cloud changes. Reload this page first if you want to see them before deciding. Overwrite anyway?');
        if(!proceed) return;
        btn.textContent = 'Pushing…'; btn.disabled = true;
        result = await forcePushToCloud(true);
      }
      btn.textContent = 'Push to Cloud Now'; btn.disabled = false;
      const fb = document.getElementById('debtFeedback');
      if(fb){
        fb.style.display = 'block';
        if(result.ok){ fb.style.background='#34D39922'; fb.style.color='var(--green)'; fb.textContent = 'Pushed to cloud successfully.'; }
        else { fb.style.background='#F8717122'; fb.style.color='var(--red)'; fb.textContent = 'Push failed: '+(result.reason||'unknown error'); }
      }
    });
  }

  document.getElementById('debtEntryForm').addEventListener('submit', e=>{
    e.preventDefault();
    const k = document.getElementById('debtKind').value;
    const f = new FormData(e.target);
    const D = getDebt(), edit = window._dEditing;
    let msg = '';
    if(k==='debt'){
      const sch = dParseSchedule(f.get('schedule'));
      if(!sch.ok){ alert('The schedule should look like 2026-10=5500, 2026-11=5500 (year-month = amount).'); return; }
      const rec = { name:String(f.get('name')).trim(), category:f.get('category'), openingBalance:+f.get('openingBalance')||0,
                    priorPaid:+f.get('priorPaid')||0, rate:+f.get('rate')||0, ratePeriod:f.get('ratePeriod'),
                    monthlyPayment:(+f.get('monthlyPayment')>0) ? +f.get('monthlyPayment') : null, schedule:sch.list, startDate:f.get('startDate') };
      if(!rec.name){ alert('Please enter a name for the debt.'); return; }
      if(edit && edit.kind==='debt'){ const d = D.debts.find(x=>x.id===edit.id); if(d) Object.assign(d, rec); msg = `Updated debt: ${rec.name}`; }
      else { D.debts.push({id:'d_'+uid(), ...rec}); msg = `Added debt: ${rec.name}`; }
    } else if(k==='payment'){
      const debt = D.debts.find(x=>x.id===f.get('debtId'));
      const amount = +f.get('amount');
      if(!debt){ alert('Please add a debt first.'); return; }
      if(!(amount>0)){ alert('Please enter an amount above zero.'); return; }
      if(f.get('type')==='interest' && annualRateOf(debt)<=0){ alert('This debt is interest-free, so a payment towards it can only be principal.'); return; }
      const rec = { debtId:debt.id, date:f.get('date'), amount, type:f.get('type') };
      if(edit && edit.kind==='payment'){ const p = D.payments.find(x=>x.id===edit.id); if(p) Object.assign(p, rec); msg = `Updated payment: ${debt.name} · ${fmtINR(amount)}`; }
      else { D.payments.push({id:uid(), ...rec}); msg = `Added payment: ${debt.name} · ${fmtINR(amount)}`; }
    } else {
      const rec = { name:String(f.get('name')).trim(), value:+f.get('value')||0, date:f.get('date') };
      if(!rec.name){ alert('Please enter a name for the asset.'); return; }
      if(edit && edit.kind==='asset'){ const a = D.assets.find(x=>x.id===edit.id); if(a) Object.assign(a, rec); msg = `Updated asset: ${rec.name}`; }
      else { D.assets.push({id:uid(), ...rec}); msg = `Added asset: ${rec.name}`; }
    }
    window._dKind = k; window._dEditing = null;
    saveDB(); renderAll();
    const fb = document.getElementById('debtFeedback');
    if(fb){ fb.style.display = 'block'; fb.textContent = msg; }
  });
}

/* ================= ROUTER ================= */
function renderAll(){
  buildSidebar();
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='instocks') renderStocksPage(1,'instocks','INR');
  else if(currentView==='usstocks') renderStocksPage(2,'usstocks','USD');
  else if(currentView==='mf') renderMF();
  else if(currentView==='ppf') renderSimpleLedger(4,'ppf','PPF','Public Provident Fund');
  else if(currentView==='epf') renderSimpleLedger(5,'epf','EPF','Employees\' Provident Fund');
  else if(currentView==='post') renderPost();
  else if(currentView==='entry') renderEntryPage();
  else if(currentView==='debtdash') renderDebtDashboard();
  else if(currentView==='mydebts') renderMyDebts();
  else if(currentView==='debtentry') renderDebtEntry();
}
renderAll();
</script>
